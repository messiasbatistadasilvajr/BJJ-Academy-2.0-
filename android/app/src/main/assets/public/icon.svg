<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with safe zone for maskable icons -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ring Shield Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="160" fill="#0b1120" stroke="url(#redGrad)" stroke-width="4" opacity="0.8" />

  <!-- BJJ Belt Symbol (Kimono knot with red tip and white stripes) -->
  <g transform="translate(0, 0)">
    <!-- Main Belt Wrap (Black) -->
    <path d="M 140 230 C 180 200, 332 200, 372 230 C 350 265, 310 270, 256 270 C 202 270, 162 265, 140 230 Z" fill="#18181b" stroke="#27272a" stroke-width="5" />
    
    <!-- Left Hanging End -->
    <path d="M 230 250 L 205 370 L 245 375 L 260 255 Z" fill="#18181b" />
    <!-- Right Hanging End (With Red Bar / Ponta Vermelha) -->
    <path d="M 252 250 L 267 375 L 307 370 L 282 250 Z" fill="#18181b" />
    
    <!-- Red Rank Bar on Right Tip -->
    <path d="M 262 335 L 266 368 L 306 363 L 302 330 Z" fill="url(#redGrad)" />
    <!-- 4 White Stripes (Graus) on Red Bar -->
    <line x1="272" y1="337" x2="274" y2="357" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="281" y1="336" x2="283" y2="356" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="290" y1="335" x2="292" y2="355" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="299" y1="334" x2="301" y2="354" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Knot -->
    <rect x="232" y="235" width="48" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="3" />
    <path d="M 240 240 L 272 272" stroke="#52525b" stroke-width="3" stroke-linecap="round" />
    <path d="M 272 240 L 240 272" stroke="#52525b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Martial Kanji / Monogram Crest -->
  <text x="256" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">BJJ</text>
  <text x="256" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="6">ACADEMY 2.0</text>
  
  <!-- Subtle stars -->
  <polygon points="256,118 259,126 268,126 261,131 263,140 256,135 249,140 251,131 244,126 253,126" fill="url(#goldGrad)" />
</svg>
